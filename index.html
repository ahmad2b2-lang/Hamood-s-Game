

<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Mind Defender</title>
</head>

<style>
	* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    margin: 0;
    padding: 0;
}
body {
    background: #0d1117;
    color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    position: fixed;
    width: 100%;
    height: 100%;
}
#game-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}
.btn2 {
    background: #238636;
    border-color: #2ea44f;
    padding: 15px 40px;
    font-size: 20px;
    color: white;
    border-radius: 12px;
    font-weight: bold;
    cursor: pointer;
}
#ui-layer {
    position: absolute;
    top: 10px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    font-size: 18px;
    font-weight: bold;
    z-index: 10;
    pointer-events: none;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
}
#canvas {
    background: radial-gradient(circle at center, #1a1f29 0%, #05070a 100%);
    width: 100%;
    flex-grow: 1;
    display: block;
}
#controls {
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: #161b22;
    padding: 10px 5px;
    border-top: 2px solid #30363d;
    min-height: 80px;
    height: auto;
    z-index: 10;
    flex-shrink: 0;
    gap: 10px;
}
.btn {
    background: #21262d;
    border: 2px solid #30363d;
    color: white;
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 16px;
    font-weight: bold;
    touch-action: manipulation;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    cursor: pointer;
    flex: 1;
    min-width: 60px;
    max-width: 120px;
    white-space: nowrap;
    -webkit-appearance: none;
    appearance: none;
}
.btn:active {
    background: #30363d;
    transform: scale(0.95);
}
#fire-btn {
    background: #1f6feb;
    border-color: #58a6ff;
    padding: 12px 25px;
}
#fire-btn:active {
    background: #0e42a8;
}
.screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(13, 17, 23, 0.95);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 20;
    text-align: center;
    padding: 20px;
}
.screen h1 {
    font-size: 32px;
    margin-bottom: 15px;
    color: #58a6ff;
}
.screen p {
    font-size: 18px;
    margin-bottom: 25px;
    color: #8b949e;
    max-width: 400px;
}
.screen .btn {
    background: #238636;
    border-color: #2ea44f;
    padding: 15px 40px;
    font-size: 20px;
}
.screen .btn:active {
    background: #2ea44f;
}
.hidden {
    display: none !important;
}
#win-screen h1 { color: #3fb950; }
#lose-screen h1 { color: #f85149; }

</style>
<body>

<div id="game-container">
	<div id="ui-layer">
		<div>Time: <span id="timer-val">60</span>s</div>
		<div>Score: <span id="score-val">0</span></div>
	</div>

	<canvas id="canvas"></canvas>

	<div id="controls">
		<button class="btn" id="left-btn">◀ Left</button>
		<button class="btn" id="fire-btn">FIRE 🚀</button>
		<button class="btn" id="right-btn">Right ▶</button>
	</div>

	<!-- Start Screen -->
	<div id="start-screen" class="screen">
		<h1>Mind Defender</h1>
		<p>Destroy the negative thoughts before they reach the bottom. Survive for 60 seconds to win!</p>
		<button class="btn2" id="start-btn">Start Game</button>
	</div>

	<!-- Win Screen -->
	<div id="win-screen" class="screen hidden">
		<h1>You Win! 🎉</h1>
		<p>You successfully protected your peace of mind and cleared the negativity.</p>
		<button class="btn2" id="restart-win-btn">Play Again</button>
	</div>

	<!-- Lose Screen -->
	<div id="lose-screen" class="screen hidden">
		<h1>Game Over 💔</h1>
		<p>The negativity overwhelmed you this time. Don't give up, try again!</p>
		<button class="btn2" id="restart-lose-btn">Try Again</button>
	</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const timerVal = document.getElementById('timer-val');
const scoreVal = document.getElementById('score-val');
const startScreen = document.getElementById('start-screen');
const winScreen = document.getElementById('win-screen');
const loseScreen = document.getElementById('lose-screen');

const negativeWords = ['DEPRESSION', 'ANXIETY', 'DOUBT', 'FEAR', 'STRESS', 'FAILURE', 'LONELINESS', 'GUILT', 'ANGER', 'SADNESS'];
const positiveWords = ['HOPE', 'JOY', 'PEACE', 'LOVE', 'STRENGTH', 'HEAL', 'FAITH', 'CALM', 'GRACE', 'LIGHT'];

let gameActive = false;
let score = 0;
let timeLeft = 60;
let playerX;
const playerYOffset = 40; 
const playerWidth = 50;
const playerHeight = 25;
let enemies = [];
let bullets = [];
let particles = [];
let lastSpawnTime = 0;
let spawnInterval = 1500;
let gameTimerInterval;

let moveLeft = false;
let moveRight = false;

function resizeCanvas() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
    if (!gameActive) {
        playerX = canvas.width / 2 - playerWidth / 2;
    }
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Universal pointer handlers for hybrid mobile/desktop inputs
const leftBtn = document.getElementById('left-btn');
const rightBtn = document.getElementById('right-btn');
const fireBtn = document.getElementById('fire-btn');

if (leftBtn) {
    leftBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); moveLeft = true; }, { passive: false });
    leftBtn.addEventListener('pointerup', (e) => { e.preventDefault(); moveLeft = false; }, { passive: false });
    leftBtn.addEventListener('pointerleave', (e) => { e.preventDefault(); moveLeft = false; }, { passive: false });
    leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft = true; }, { passive: false });
    leftBtn.addEventListener('touchend', (e) => { e.preventDefault(); moveLeft = false; }, { passive: false });
}

if (rightBtn) {
    rightBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); moveRight = true; }, { passive: false });
    rightBtn.addEventListener('pointerup', (e) => { e.preventDefault(); moveRight = false; }, { passive: false });
    rightBtn.addEventListener('pointerleave', (e) => { e.preventDefault(); moveRight = false; }, { passive: false });
    rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveRight = true; }, { passive: false });
    rightBtn.addEventListener('touchend', (e) => { e.preventDefault(); moveRight = false; }, { passive: false });
}

if (fireBtn) {
    fireBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); fireBullet(); }, { passive: false });
    fireBtn.addEventListener('touchstart', (e) => { e.preventDefault(); fireBullet(); }, { passive: false });
}

// Keyboard configurations
window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLeft = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveRight = true;
    if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); fireBullet(); }
});
window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLeft = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveRight = false;
});

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-win-btn').addEventListener('click', startGame);
document.getElementById('restart-lose-btn').addEventListener('click', startGame);

function startGame() {
    startScreen.classList.add('hidden');
    winScreen.classList.add('hidden');
    loseScreen.classList.add('hidden');
    
    score = 0;
    timeLeft = 60;
    enemies = [];
    bullets = [];
    particles = [];
    scoreVal.textContent = score;
    timerVal.textContent = timeLeft;
    resizeCanvas();
    gameActive = true;
    lastSpawnTime = performance.now();

    clearInterval(gameTimerInterval);
    gameTimerInterval = setInterval(() => {
        if (!gameActive) return;
        timeLeft--;
        timerVal.textContent = timeLeft;
        if (timeLeft <= 0) {
            endGame(true);
        }
    }, 1000);

    requestAnimationFrame(gameLoop);
}

function endGame(isWin) {
    gameActive = false;
    clearInterval(gameTimerInterval);
    if (isWin) {
        winScreen.classList.remove('hidden');
    } else {
        loseScreen.classList.remove('hidden');
    }
}

function fireBullet() {
    if (!gameActive) return;
    
    const text = positiveWords[Math.floor(Math.random() * positiveWords.length)];
    ctx.font = 'bold 14px Arial';
    const textWidth = ctx.measureText(text).width;

    bullets.push({
        x: (playerX + playerWidth / 2) - (textWidth / 2), // Center the word over the ship
        y: canvas.height - playerYOffset - playerHeight,
        text: text,
        width: textWidth,
        height: 14,
        speed: 6
    });
}

function spawnEnemy() {
    const text = negativeWords[Math.floor(Math.random() * negativeWords.length)];
    ctx.font = 'bold 16px Arial';
    const textWidth = ctx.measureText(text).width;
    
    const x = Math.random() * (canvas.width - textWidth - 20) + 10;
    enemies.push({
        x: x,
        y: -20,
        text: text,
        width: textWidth,
        height: 16,
        speed: 1.2 + (60 - timeLeft) * 0.02
    });
}

function createExplosion(x, y) {
    for (let i = 0; i < 20; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 7,
            vy: (Math.random() - 0.5) * 7,
            radius: Math.random() * 3 + 1,
            alpha: 1,
            color: `hsl(${Math.random() * 40 + 190}, 100%, 75%)` // Beautiful bright blues/cyans
        });
    }
}

function gameLoop(timestamp) {
    if (!gameActive) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const playerSpeed = 6;
    if (moveLeft && playerX > 0) playerX -= playerSpeed;
    if (moveRight && playerX < canvas.width - playerWidth) playerX += playerSpeed;

    // Draw ship (Now pure white to complement the blues)
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    const py = canvas.height - playerYOffset;
    ctx.moveTo(playerX + playerWidth / 2, py - playerHeight);
    ctx.lineTo(playerX, py);
    ctx.lineTo(playerX + playerWidth, py);
    ctx.closePath();
    ctx.fill();

    if (timestamp - lastSpawnTime > spawnInterval) {
        spawnEnemy();
        lastSpawnTime = timestamp;
        spawnInterval = Math.max(600, 1500 - (60 - timeLeft) * 15);
    }

    // Update & Draw Positive Word Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.y -= b.speed;
        
        ctx.fillStyle = '#58a6ff'; // Positive Blue
        ctx.font = 'bold 14px Arial';
        ctx.textBaseline = 'top';
        ctx.fillText(b.text, b.x, b.y);

        if (b.y < -20) bullets.splice(i, 1);
    }

    // Update & Draw Negative Word Enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        e.y += e.speed;

        ctx.fillStyle = '#ff7b72'; // Negative Red/Pink
        ctx.font = 'bold 16px Arial';
        ctx.textBaseline = 'top';
        ctx.fillText(e.text, e.x, e.y);

        if (e.y + e.height >= canvas.height - playerYOffset) {
            endGame(false);
            return;
        }

        // AABB (Bounding Box) Collision between Word Bullet and Word Enemy
        for (let j = bullets.length - 1; j >= 0; j--) {
            let b = bullets[j];
            
            if (b.x < e.x + e.width &&
                b.x + b.width > e.x &&
                b.y < e.y + e.height &&
                b.y + b.height > e.y) {
                
                createExplosion(e.x + e.width / 2, e.y + e.height / 2);
                enemies.splice(i, 1);
                bullets.splice(j, 1);
                score += 10;
                scoreVal.textContent = score;
                break;
            }
        }
    }

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.02;

        if (p.alpha <= 0) {
            particles.splice(i, 1);
            continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.restore();
    }

    requestAnimationFrame(gameLoop);
}


</script>

</body>
</html>
